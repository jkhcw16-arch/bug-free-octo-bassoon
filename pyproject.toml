[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotational-prime-ontology"
version = "0.1.0"
description = "Deterministic, auditable decision architecture"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.104,<1", "pydantic>=2.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
